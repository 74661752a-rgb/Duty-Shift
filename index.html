관리 업무를 병행함에 따라 해당 업무를 이해하고 숙지한다.","fix":""},{"key":"2f6750a8-g3","role_id":"2f6750a8","role_name":"오후 로비","kind":"업무 목표","no":3,"text":"3.사무용품 관리","fix":""},{"key":"2f6750a8-g4","role_id":"2f6750a8","role_name":"오후 로비","kind":"업무 목표","no":4,"text":"4.호텔 전반적인 자사 상품에 대한 사전 숙지와 프로모션 상품에 대해 사전에 숙지한다.","fix":""},{"key":"2f6750a8-g5","role_id":"2f6750a8","role_name":"오후 로비","kind":"업무 목표","no":5,"text":"5.정보 안내 -> 고객님께 관광지 소개 및 맛집 등 정보 안내","fix":""},{"key":"2f6750a8-g6","role_id":"2f6750a8","role_name":"오후 로비","kind":"업무 목표","no":6,"text":"6. 현관 및 엘리베이터 출입시 편안함을 제공한다.","fix":""},{"key":"2f6750a8-g7","role_id":"2f6750a8","role_name":"오후 로비","kind":"업무 목표","no":7,"text":"7. 그룹 도착 및 고객 밀집시 수화물 관리와 고객 동선 운영을 최적화 한다.","fix":""},{"key":"2f6750a8-p1","role_id":"2f6750a8","role_name":"오후 로비","kind":"사전 점검","no":1,"text":"1.호텔리어로서 용무복장에 대해 준비 후 업무에 임하였는가?","fix":""},{"key":"2f6750a8-p2","role_id":"2f6750a8","role_name":"오후 로비","kind":"사전 점검","no":2,"text":"2.로비 지역 비품 및 청결관리에 대해 인지하고 있는가?","fix":""},{"key":"2f6750a8-p3","role_id":"2f6750a8","role_name":"오후 로비","kind":"사전 점검","no":3,"text":"3.객실 방문시 고객에게 편안한 인상을 줄 수 있는가?","fix":""},{"key":"2f6750a8-p4","role_id":"2f6750a8","role_name":"오후 로비","kind":"사전 점검","no":4,"text":"4.고객의 물품에 대해 중요도를 인식하고 있는가?","fix":""},{"key":"2f6750a8-p5","role_id":"2f6750a8","role_name":"오후 로비","kind":"사전 점검","no":5,"text":"5.고객에게 안내되어질 정보에 대한 사전 지식은 충분히 습득하고 있는가?","fix":""},{"key":"2f6750a8-p6","role_id":"2f6750a8","role_name":"오후 로비","kind":"사전 점검","no":6,"text":"6.고객 대여품 관리는 청결하고 정확하게 이루어지고 있는가?","fix":""},{"key":"2f6750a8-p7","role_id":"2f6750a8","role_name":"오후 로비","kind":"사전 점검","no":7,"text":"7.객실관리 업무에 대해 충분히 이해하고 숙지하고 있는가?","fix":""},{"key":"2f6750a8-m1","role_id":"2f6750a8","role_name":"오후 로비","kind":"자주 하는 실수","no":1,"text":"1.잘못된 정보 안내로 인한 불평(해당 업소의 휴무 또는 상호변경등)","fix":"1.외부업소 안내 시 사전에 전화를 통해 변동사항을 확인한다."},{"key":"2f6750a8-m2","role_id":"2f6750a8","role_name":"오후 로비","kind":"자주 하는 실수","no":2,"text":"2.외부 음식물 반입 제재로 인한 고객 불평","fix":"2.외부 음식물로 인한 냄새로 인한 환기, 카펫 손상등이 우려로 슈정상 반입 불가를 안내드린다."},{"key":"2f6750a8-m3","role_id":"2f6750a8","role_name":"오후 로비","kind":"자주 하는 실수","no":3,"text":"3.잘못된 객실로의 짐 반입","fix":"3.고객께는 짐이 늦어진 부분에 대해 양해를 구하고, 더 나은 서비스를 제공한다."},{"key":"2f6750a8-m4","role_id":"2f6750a8","role_name":"오후 로비","kind":"자주 하는 실수","no":4,"text":"4.신,본관 외부 동선 이동시 거친 바닥면으로 인해 고객의 짐 이탈 현상으로 고객의 짐이 훼손되는 경우","fix":"4.상황에 따라 내부 연결 통로를 이용하여 안내한다."},{"key":"2f6750a8-m5","role_id":"2f6750a8","role_name":"오후 로비","kind":"자주 하는 실수","no":5,"text":"5.본관 주차장 E/V 시설 미흡으로 인한 불평","fix":"5.미흡한 부분에 대해 양해를 구하고 C/OUT시에는 도움을 드리도록한다."},{"key":"2f6750a8-m6","role_id":"2f6750a8","role_name":"오후 로비","kind":"자주 하는 실수","no":6,"text":"6. 차량 배차 요청시 호텔 배차 / 점보/ 모범/ 일반 등을 구분할 것","fix":"6. 출발 시간 외 목적지, 탑승자 수, 짐 갯수등을 추가 문의한다."},{"key":"971c92d8-g1","role_id":"971c92d8","role_name":"야간 지배인","kind":"업무 목표","no":1,"text":"1. 당일 업무의 최종 정리","fix":""},{"key":"971c92d8-g2","role_id":"971c92d8","role_name":"야간 지배인","kind":"업무 목표","no":2,"text":"2. 익일 C/IN 예정 VIP 정리","fix":""},{"key":"971c92d8-g3","role_id":"971c92d8","role_name":"야간 지배인","kind":"업무 목표","no":3,"text":"3. 익일 C/IN 예정 GROUP 정리","fix":""},{"key":"971c92d8-g4","role_id":"971c92d8","role_name":"야간 지배인","kind":"업무 목표","no":4,"text":"4. 익일 C/IN 주의 고객 정리","fix":""},{"key":"971c92d8-g5","role_id":"971c92d8","role_name":"야간 지배인","kind":"업무 목표","no":5,"text":"5. 당일 VOC 및 주요인계 사항 정리","fix":""},{"key":"971c92d8-g6","role_id":"971c92d8","role_name":"야간 지배인","kind":"업무 목표","no":6,"text":"6. 정확한 상품적용으로 정확한 요금 발생 확인","fix":""},{"key":"971c92d8-g7","role_id":"971c92d8","role_name":"야간 지배인","kind":"업무 목표","no":7,"text":"7. 주간 근무자들을 위한 업무 보조 (그룹 KEY , ASSIGN)","fix":""},{"key":"971c92d8-p1","role_id":"971c92d8","role_name":"야간 지배인","kind":"사전 점검","no":1,"text":"1. 주간 근무시 발생된 인계사항등을 정확히 숙지한다.","fix":""},{"key":"971c92d8-p2","role_id":"971c92d8","role_name":"야간 지배인","kind":"사전 점검","no":2,"text":"2. 익일 C/IN 예정 고객들의 요청사항등을 세밀하게 확인한다.","fix":""},{"key":"971c92d8-p3","role_id":"971c92d8","role_name":"야간 지배인","kind":"사전 점검","no":3,"text":"3. 문서 정리상(오타)에 실수가 없도록 주의한다.","fix":""},{"key":"971c92d8-p4","role_id":"971c92d8","role_name":"야간 지배인","kind":"사전 점검","no":4,"text":"4. 전일 발생한 모든 일들을 누락없이 정확하게 주간 근무자에게 인계한다.","fix":""},{"key":"971c92d8-p5","role_id":"971c92d8","role_name":"야간 지배인","kind":"사전 점검","no":5,"text":"5. 익일 주간 근무자의 업무상 부족함이 없도록 준비한다.","fix":""},{"key":"971c92d8-m1","role_id":"971c92d8","role_name":"야간 지배인","kind":"자주 하는 실수","no":1,"text":"1. 미 도착 고객의 처리 관계 (KEY 발행 유,무 체크)","fix":"1. 업무전 인수인계시 미도착 고객의 정리 관계를 재확인 한다."},{"key":"971c92d8-m2","role_id":"971c92d8","role_name":"야간 지배인","kind":"자주 하는 실수","no":2,"text":"2. 예약된 상품이 아닌 다른 상품으로 객실요금 발생","fix":"2. Trial Room Revenue Report와 Convention FILE & Group LIST를 통해 FINAL 이 전에 정확히 정리해 둔다."},{"key":"971c92d8-m3","role_id":"971c92d8","role_name":"야간 지배인","kind":"자주 하는 실수","no":3,"text":"3. 문서 작성시 오타 및 날짜 확인 누락","fix":"3. 출력 전 더블 체크하여 실수를 줄인다."},{"key":"091927a6-g1","role_id":"091927a6","role_name":"야간 캐셔","kind":"업무 목표","no":1,"text":"1. 당일 시재금 입금처리 및 시재금 최종정리","fix":""},{"key":"091927a6-g2","role_id":"091927a6","role_name":"야간 캐셔","kind":"업무 목표","no":2,"text":"2. 당일 업무 최종 마감 및 리포트 작성","fix":""},{"key":"091927a6-g3","role_id":"091927a6","role_name":"야간 캐셔","kind":"업무 목표","no":3,"text":"3. 당일 미처리 업무 파악하여 인수인계","fix":""},{"key":"091927a6-g4","role_id":"091927a6","role_name":"야간 캐셔","kind":"업무 목표","no":4,"text":"4. 익일 C/OUT 고객 정보 파악하여 정산 처리 및 인수인계","fix":""},{"key":"091927a6-p1","role_id":"091927a6","role_name":"야간 캐셔","kind":"사전 점검","no":1,"text":"1. 시재금 및 업무 인수인계에 대해 정확히 이해를 하고 인계를 받았는가?","fix":""},{"key":"091927a6-p2","role_id":"091927a6","role_name":"야간 캐셔","kind":"사전 점검","no":2,"text":"2. 익일 C/OUT 고객들의 정산관계를 파악하고 정산범위와 결제 방법에 따라 정리한다.","fix":""},{"key":"091927a6-p3","role_id":"091927a6","role_name":"야간 캐셔","kind":"사전 점검","no":3,"text":"3. 익일 근무자의 업무에 도움이 되도록 고객 요청사항을 파악하고 준비하여 인수인계한다.","fix":""},{"key":"091927a6-m1","role_id":"091927a6","role_name":"야간 캐셔","kind":"자주 하는 실수","no":1,"text":"1. 사전 정산 업무 객실 누락","fix":"1. 리포트 작성시 꼼꼼하게 확인-정리하고, 동일한 업무가 진행되도록 교육한다."},{"key":"091927a6-m2","role_id":"091927a6","role_name":"야간 캐셔","kind":"자주 하는 실수","no":2,"text":"2. 정산금액 및 청구 실수 (AR NO. 청구 실수)","fix":"2. 정산업무시, 코멘트를 반드시 잘 확인하고 진행할 수 있도록 한다."},{"key":"091927a6-m3","role_id":"091927a6","role_name":"야간 캐셔","kind":"자주 하는 실수","no":3,"text":"3. 업무단계 누락","fix":"3. 누락항목이 발생하지 않도록 가능한 리포팅된 순서대로 업무를 진행한다."},{"key":"4d3c6d02-g1","role_id":"4d3c6d02","role_name":"야간 로비","kind":"업무 목표","no":1,"text":"1.객실관리 직원의 부재로 인한 업무 손실을 야간조에서 보완한다.","fix":""},{"key":"4d3c6d02-g2","role_id":"4d3c6d02","role_name":"야간 로비","kind":"업무 목표","no":2,"text":"2.야간시간의 특성상 오더 업무시 객실번호는 반복적으로 확인하여 실수 없이 방문할수 있도록 한다.","fix":""},{"key":"4d3c6d02-g3","role_id":"4d3c6d02","role_name":"야간 로비","kind":"업무 목표","no":3,"text":"3.정확한 신문 배정과 신속한 신문 배달","fix":""},{"key":"4d3c6d02-g4","role_id":"4d3c6d02","role_name":"야간 로비","kind":"업무 목표","no":4,"text":"4.소수의 인원이 근무함에 따라 프런트 업무 또한 숙지한다.","fix":""},{"key":"4d3c6d02-g5","role_id":"4d3c6d02","role_name":"야간 로비","kind":"업무 목표","no":5,"text":"5.고객 불평에 대한 대처 능력 함양에 힘쓴다.","fix":""},{"key":"4d3c6d02-g6","role_id":"4d3c6d02","role_name":"야간 로비","kind":"업무 목표","no":6,"text":"6.특수 고객(취객, 노숙자, 행동이상자등)에 대해 정확한 응대가 이루어 질 수 있도록한다.","fix":""},{"key":"4d3c6d02-p1","role_id":"4d3c6d02","role_name":"야간 로비","kind":"사전 점검","no":1,"text":"1.객실관리 업무에 대한 충분히 숙지하고 있는가?","fix":""},{"key":"4d3c6d02-p2","role_id":"4d3c6d02","role_name":"야간 로비","kind":"사전 점검","no":2,"text":"2.고객의 요청된 신문 배정에 대해 정확하게 파악하고 있는가?","fix":""},{"key":"4d3c6d02-p3","role_id":"4d3c6d02","role_name":"야간 로비","kind":"사전 점검","no":3,"text":"3.프런트 업무는 충분히 숙지하고 있는가?","fix":""},{"key":"4d3c6d02-p4","role_id":"4d3c6d02","role_name":"야간 로비","kind":"사전 점검","no":4,"text":"4.고객 불평 대처 능력에 대해 준비하고 있는가?","fix":""},{"key":"4d3c6d02-p5","role_id":"4d3c6d02","role_name":"야간 로비","kind":"사전 점검","no":5,"text":"5.특수 고객 발생 시 대처에 대해 준비하고 있는가?","fix":""},{"key":"4d3c6d02-p6","role_id":"4d3c6d02","role_name":"야간 로비","kind":"사전 점검","no":6,"text":"6.호텔리어로서 용무복장에 대해 준비 후
